<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中学地理 一問一答</title>

<style>
:root {
  --main: #3978d4;
  --main-light: #eaf2ff;
  --bg: #f4f7fc;
  --card: #ffffff;
  --text: #263449;
  --sub: #718096;
  --border: #dce4ef;
  --green: #20a46b;
  --red: #e05252;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family:
    "Yu Gothic",
    "Meiryo",
    sans-serif;
  background: var(--bg);
  color: var(--text);
}

button, select, input {
  font: inherit;
}

header {
  background: white;
  border-bottom: 1px solid var(--border);
  padding: 18px 24px;
  position: sticky;
  top: 0;
  z-index: 20;
}

.header-inner {
  max-width: 1100px;
  margin: auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.logo {
  font-size: 21px;
  font-weight: 800;
  color: var(--main);
}

.logo span {
  font-size: 12px;
  display: block;
  color: var(--sub);
  font-weight: 500;
  margin-top: 3px;
}

main {
  max-width: 1100px;
  margin: 28px auto;
  padding: 0 18px 50px;
}

.intro {
  background: linear-gradient(120deg, #3978d4, #69a6ef);
  color: white;
  padding: 28px;
  border-radius: 18px;
  margin-bottom: 22px;
}

.intro h1 {
  margin: 0 0 10px;
  font-size: 26px;
}

.intro p {
  margin: 0;
  opacity: .9;
  line-height: 1.7;
}

.filters {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  background: white;
  border: 1px solid var(--border);
  padding: 16px;
  border-radius: 14px;
  margin-bottom: 20px;
}

.filter-item {
  flex: 1;
  min-width: 160px;
}

.filter-item label {
  display: block;
  font-size: 12px;
  color: var(--sub);
  margin-bottom: 6px;
  font-weight: bold;
}

.filter-item select {
  width: 100%;
  padding: 11px;
  border: 1px solid var(--border);
  border-radius: 9px;
  background: white;
  color: var(--text);
}

.tabs {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 8px;
  margin-bottom: 20px;
}

.tab {
  border: 1px solid var(--border);
  background: white;
  border-radius: 10px;
  padding: 13px 6px;
  cursor: pointer;
  font-weight: bold;
  color: var(--sub);
  transition: .2s;
}

.tab:hover {
  border-color: var(--main);
  color: var(--main);
}

.tab.active {
  background: var(--main);
  color: white;
  border-color: var(--main);
}

.status-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin-bottom: 10px;
  font-size: 13px;
  color: var(--sub);
}

.progress {
  height: 8px;
  background: #e3eaf4;
  border-radius: 20px;
  overflow: hidden;
  margin-bottom: 20px;
}

.progress-inner {
  height: 100%;
  background: var(--main);
  width: 0%;
  transition: width .3s;
}

.question-card {
  background: white;
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 28px;
  box-shadow: 0 5px 18px rgba(35, 60, 100, .04);
}

.question-meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin-bottom: 22px;
  flex-wrap: wrap;
}

.unit-badge {
  background: var(--main-light);
  color: var(--main);
  padding: 6px 12px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: bold;
}

.question-number {
  font-size: 13px;
  color: var(--sub);
}

.question-text {
  font-size: 23px;
  font-weight: bold;
  line-height: 1.8;
  margin: 15px 0 25px;
  min-height: 75px;
}

.answer-area {
  background: #f7f9fc;
  border: 1px solid var(--border);
  padding: 20px;
  border-radius: 13px;
  text-align: center;
}

.answer-label {
  font-size: 12px;
  color: var(--sub);
  margin-bottom: 10px;
}

.answer-text {
  font-size: 24px;
  font-weight: 800;
  color: var(--main);
  min-height: 36px;
}

.answer-hidden {
  filter: blur(8px);
  user-select: none;
}

.action-buttons {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  justify-content: center;
  margin-top: 18px;
}

.btn {
  border: none;
  border-radius: 10px;
  padding: 12px 20px;
  font-weight: bold;
  cursor: pointer;
  transition: .2s;
}

.btn:hover {
  transform: translateY(-1px);
  filter: brightness(.97);
}

.btn-primary {
  background: var(--main);
  color: white;
}

.btn-secondary {
  background: #edf1f7;
  color: var(--text);
}

.btn-green {
  background: #e3f7ed;
  color: var(--green);
}

.btn-red {
  background: #fff0f0;
  color: var(--red);
}

.options {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-top: 20px;
}

.option {
  padding: 16px;
  background: white;
  border: 2px solid var(--border);
  border-radius: 11px;
  cursor: pointer;
  text-align: left;
  font-weight: bold;
  transition: .2s;
}

.option:hover:not(:disabled) {
  border-color: var(--main);
  background: var(--main-light);
}

.option.correct {
  background: #e4f8ed;
  border-color: var(--green);
  color: #137d4d;
}

.option.wrong {
  background: #fff0f0;
  border-color: var(--red);
  color: #c23b3b;
}

.option:disabled {
  cursor: default;
}

.feedback {
  display: none;
  margin-top: 18px;
  padding: 16px;
  border-radius: 12px;
  line-height: 1.7;
  font-weight: bold;
}

.feedback.correct {
  display: block;
  background: #e4f8ed;
  color: #137d4d;
}

.feedback.wrong {
  display: block;
  background: #fff0f0;
  color: #c23b3b;
}

.answer-input {
  width: 100%;
  padding: 15px;
  border: 2px solid var(--border);
  border-radius: 10px;
  font-size: 18px;
  outline: none;
  margin: 10px 0;
}

.answer-input:focus {
  border-color: var(--main);
}

.table-container {
  overflow-x: auto;
  background: white;
  border-radius: 14px;
  border: 1px solid var(--border);
}

table {
  border-collapse: collapse;
  width: 100%;
  min-width: 500px;
}

th, td {
  padding: 14px;
  text-align: left;
  border-bottom: 1px solid var(--border);
  line-height: 1.6;
}

th {
  background: #f2f6fc;
  color: var(--sub);
  font-size: 13px;
}

td {
  font-size: 14px;
}

.summary-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 14px;
}

.summary-card {
  background: white;
  border: 1px solid var(--border);
  border-radius: 13px;
  padding: 20px;
}

.summary-card h3 {
  color: var(--main);
  margin: 0 0 10px;
  font-size: 17px;
}

.summary-card p {
  margin: 0;
  line-height: 1.8;
  font-size: 14px;
}

.empty {
  text-align: center;
  padding: 40px 15px;
  color: var(--sub);
}

.hidden {
  display: none !important;
}

footer {
  text-align: center;
  color: var(--sub);
  font-size: 12px;
  padding: 25px;
}

@media(max-width: 650px) {
  header {
    padding: 14px;
  }

  main {
    padding: 0 12px 35px;
    margin-top: 18px;
  }

  .intro {
    padding: 22px;
  }

  .intro h1 {
    font-size: 22px;
  }

  .tabs {
    grid-template-columns: repeat(3, 1fr);
  }

  .tab {
    font-size: 12px;
    padding: 12px 4px;
  }

  .question-card {
    padding: 18px;
  }

  .question-text {
    font-size: 19px;
  }

  .options {
    grid-template-columns: 1fr;
  }

  .summary-grid {
    grid-template-columns: 1fr;
  }

  .answer-text {
    font-size: 21px;
  }
}
</style>
</head>

<body>

<header>
  <div class="header-inner">
    <div class="logo">
      📘 中学地理 一問一答
      <span>定期テスト対策・重要語句チェック</span>
    </div>
    <button class="btn btn-secondary" onclick="resetProgress()">
      ↻ リセット
    </button>
  </div>
</header>

<main>

  <section class="intro">
    <h1>地理をマスターしよう！</h1>
    <p>
      中学1・2年生の重要語句を一問一答形式で学習できるサイト。<br>
      自分に合った学習モードで、効率よく復習しよう！
    </p>
  </section>

  <section class="filters">

    <div class="filter-item">
      <label>学年</label>
      <select id="gradeFilter" onchange="changeFilter()">
        <option value="all">すべての学年</option>
        <option value="1年生">1年生</option>
        <option value="2年生">2年生</option>
      </select>
    </div>

    <div class="filter-item">
      <label>単元</label>
      <select id="unitFilter" onchange="changeFilter()">
        <option value="all">すべての単元</option>
      </select>
    </div>

    <div class="filter-item">
      <label>出題順</label>
      <select id="orderFilter" onchange="changeOrder()">
        <option value="normal">登録順</option>
        <option value="random">ランダム</option>
      </select>
    </div>

  </section>

  <section class="tabs">
    <button class="tab active" onclick="changeMode('red',this)">
      🔴 赤シート
    </button>

    <button class="tab" onclick="changeMode('choice',this)">
      📝 選択問題
    </button>

    <button class="tab" onclick="changeMode('input',this)">
      ✏️ 記入問題
    </button>

    <button class="tab" onclick="changeMode('table',this)">
      📋 答え一覧
    </button>

    <button class="tab" onclick="changeMode('summary',this)">
      📖 地域調査
    </button>
  </section>

  <section id="studyArea">

    <div class="status-bar">
      <span id="questionCounter">問題 1 / 1</span>
      <span id="scoreDisplay">正解数：0</span>
    </div>

    <div class="progress">
      <div class="progress-inner" id="progressInner"></div>
    </div>

    <div class="question-card">

      <div class="question-meta">
        <span class="unit-badge" id="unitBadge">単元</span>
        <span class="question-number" id="questionNumber">第1問</span>
      </div>

      <div class="question-text" id="questionText">
        問題を読み込み中...
      </div>

      <!-- 赤シートモード -->
      <div id="redMode">

        <div class="answer-area">
          <div class="answer-label">答え</div>
          <div class="answer-text answer-hidden" id="redAnswer">
            答え
          </div>
        </div>

        <div class="action-buttons">
          <button class="btn btn-primary" onclick="toggleAnswer()">
            答えを表示
          </button>
        </div>

      </div>

      <!-- 選択問題モード -->
      <div id="choiceMode" class="hidden">

        <div class="options" id="optionsArea"></div>

        <div class="feedback" id="choiceFeedback"></div>

      </div>

      <!-- 記入問題モード -->
      <div id="inputMode" class="hidden">

        <input
          type="text"
          class="answer-input"
          id="answerInput"
          placeholder="答えを入力..."
          autocomplete="off"
        >

        <div class="action-buttons">
          <button class="btn btn-primary" onclick="checkInput()">
            答え合わせ
          </button>
        </div>

        <div class="feedback" id="inputFeedback"></div>

      </div>

      <div class="action-buttons">
        <button class="btn btn-secondary" onclick="previousQuestion()">
          ← 前の問題
        </button>

        <button class="btn btn-primary" onclick="nextQuestion()">
          次の問題 →
        </button>
      </div>

    </div>

  </section>

  <!-- 答え一覧 -->
  <section id="tableArea" class="hidden">

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>番号</th>
            <th>問題</th>
            <th>答え</th>
          </tr>
        </thead>
        <tbody id="answerTable"></tbody>
      </table>
    </div>

  </section>

  <!-- 地域調査まとめ -->
  <section id="summaryArea" class="hidden">

    <div class="summary-grid" id="summaryGrid"></div>

  </section>

</main>

<footer>
  中学地理 一問一答 ｜ 学習用サイト
</footer>

// ==============================
// 問題データの取得
// ==============================

function getQuestions() {
  return geographyQuestions.filter(q => q.question && q.answer);
}

function getUnits() {
  const grade = document.getElementById("gradeFilter").value;

  const units = [...new Set(
    geographyQuestions
      .filter(q => q.question && q.answer)
      .filter(q => grade === "all" || q.grade === grade)
      .map(q => q.unit)
  )];

  return units;
}

// ==============================
// フィルター
// ==============================

function updateUnitOptions() {
  const select = document.getElementById("unitFilter");
  const previous = select.value;

  const units = getUnits();

  select.innerHTML = '<option value="all">すべての単元</option>';

  units.forEach(unit => {
    const option = document.createElement("option");
    option.value = unit;
    option.textContent = unit;
    select.appendChild(option);
  });

  if (units.includes(previous)) {
    select.value = previous;
  }
}

// ==============================
// フィルター修正版
// ==============================

function changeFilter() {
  // 学年を変更したら単元もリセット
  document.getElementById("unitFilter").value = "all";

  updateUnitOptions();

  currentIndex = 0;
  answeredQuestions.clear();
  correctCount = 0;

  prepareQuestions();
}

function prepareQuestions() {
  const grade = document.getElementById("gradeFilter").value;
  const unit = document.getElementById("unitFilter").value;
  const order = document.getElementById("orderFilter").value;

  // 問題データから学年・単元が一致するものだけ取得
  filteredQuestions = geographyQuestions.filter(q => {

    if (!q.question || !q.answer) return false;

    const gradeMatch =
      grade === "all" || String(q.grade).trim() === grade;

    const unitMatch =
      unit === "all" || String(q.unit).trim() === unit;

    return gradeMatch && unitMatch;
  });

  // ランダム出題
  if (order === "random") {
    filteredQuestions = [...filteredQuestions].sort(
      () => Math.random() - 0.5
    );
  }

  currentIndex = 0;
  answerVisible = false;
  alreadyAnswered = false;

  updateDisplay();
}

// ==============================
// モード切り替え
// ==============================

function changeMode(mode, button) {
  currentMode = mode;

  document.querySelectorAll(".tab").forEach(tab => {
    tab.classList.remove("active");
  });

  button.classList.add("active");

  document.getElementById("studyArea").classList.add("hidden");
  document.getElementById("tableArea").classList.add("hidden");
  document.getElementById("summaryArea").classList.add("hidden");

  if (mode === "table") {
    document.getElementById("tableArea").classList.remove("hidden");
    createAnswerTable();
    return;
  }

  if (mode === "summary") {
    document.getElementById("summaryArea").classList.remove("hidden");
    createSummary();
    return;
  }

  document.getElementById("studyArea").classList.remove("hidden");

  document.getElementById("redMode").classList.toggle(
    "hidden", mode !== "red"
  );

  document.getElementById("choiceMode").classList.toggle(
    "hidden", mode !== "choice"
  );

  document.getElementById("inputMode").classList.toggle(
    "hidden", mode !== "input"
  );

  updateDisplay();
}

// ==============================
// 問題表示
// ==============================

function updateDisplay() {
  if (filteredQuestions.length === 0) {
    document.getElementById("questionText").textContent =
      "この条件に該当する問題はありません。";

    document.getElementById("questionCounter").textContent =
      "問題 0 / 0";

    document.getElementById("unitBadge").textContent =
      "問題なし";

    document.getElementById("questionNumber").textContent = "";

    document.getElementById("redAnswer").textContent = "";

    document.getElementById("progressInner").style.width = "0%";

    document.getElementById("optionsArea").innerHTML = "";

    document.getElementById("choiceFeedback").className = "feedback";
    document.getElementById("inputFeedback").className = "feedback";

    return;
  }

  if (currentIndex >= filteredQuestions.length) {
    currentIndex = 0;
  }

  const q = filteredQuestions[currentIndex];

  answerVisible = false;
  alreadyAnswered = false;

  document.getElementById("questionText").textContent = q.question;

  document.getElementById("unitBadge").textContent = q.unit;

  document.getElementById("questionNumber").textContent =
    "第" + (currentIndex + 1) + "問";

  document.getElementById("questionCounter").textContent =
    "問題 " + (currentIndex + 1) +
    " / " + filteredQuestions.length;

  document.getElementById("scoreDisplay").textContent =
    "正解数：" + correctCount;

  document.getElementById("progressInner").style.width =
    ((currentIndex + 1) / filteredQuestions.length * 100) + "%";

  document.getElementById("redAnswer").textContent = q.answer;

  document.getElementById("redAnswer").classList.add("answer-hidden");

  document.querySelector("#redMode .btn-primary").textContent =
    "答えを表示";

  document.getElementById("choiceFeedback").className = "feedback";
  document.getElementById("inputFeedback").className = "feedback";

  document.getElementById("answerInput").value = "";

  if (currentMode === "choice") {
    createChoices();
  }

  updateScore();
}

// ==============================
// 赤シート
// ==============================

function toggleAnswer() {
  answerVisible = !answerVisible;

  const answer = document.getElementById("redAnswer");

  answer.classList.toggle("answer-hidden", !answerVisible);

  document.querySelector("#redMode .btn-primary").textContent =
    answerVisible ? "答えを隠す" : "答えを表示";
}

// ==============================
// 選択問題
// ==============================

function createChoices() {
  const q = filteredQuestions[currentIndex];

  const optionsArea = document.getElementById("optionsArea");

  const answers = [...new Set(
    getQuestions()
      .map(item => item.answer)
      .filter(answer => answer !== q.answer)
  )];

  const wrongAnswers = answers
    .sort(() => Math.random() - 0.5)
    .slice(0, 3);

  const choices = [...wrongAnswers, q.answer]
    .sort(() => Math.random() - 0.5);

  optionsArea.innerHTML = "";

  choices.forEach((choice, index) => {
    const button = document.createElement("button");

    button.className = "option";
    button.textContent =
      String.fromCharCode(65 + index) + ". " + choice;

    button.onclick = () => checkChoice(choice, button);

    optionsArea.appendChild(button);
  });
}

function checkChoice(selected, button) {
  if (alreadyAnswered) return;

  alreadyAnswered = true;

  const q = filteredQuestions[currentIndex];

  const correct = selected === q.answer;

  if (correct) {
    correctCount++;
    button.classList.add("correct");
    showFeedback(
      "choiceFeedback",
      true,
      "正解！ 答えは「" + q.answer + "」"
    );
  } else {
    button.classList.add("wrong");

    showFeedback(
      "choiceFeedback",
      false,
      "不正解！ 正解は「" + q.answer + "」"
    );
  }

  document.querySelectorAll(".option").forEach(option => {
    option.disabled = true;

    if (option.textContent.endsWith(q.answer)) {
      option.classList.add("correct");
    }
  });

  markAnswered();
  updateScore();
}

// ==============================
// 記入問題
// ==============================

function normalizeAnswer(value) {
  return value
    .normalize("NFKC")
    .toLowerCase()
    .replace(/\s/g, "")
    .replace(/[。、・,，.．!！?？]/g, "");
}

function checkInput() {
  if (alreadyAnswered) return;

  const q = filteredQuestions[currentIndex];

  const input = document.getElementById("answerInput").value;

  if (!input.trim()) {
    alert("答えを入力してね！");
    return;
  }

  alreadyAnswered = true;

  const correct =
    normalizeAnswer(input) === normalizeAnswer(q.answer);

  if (correct) {
    correctCount++;

    showFeedback(
      "inputFeedback",
      true,
      "正解！ 答えは「" + q.answer + "」"
    );
  } else {
    showFeedback(
      "inputFeedback",
      false,
      "不正解！ 正解は「" + q.answer + "」"
    );
  }

  markAnswered();
  updateScore();
}

document.getElementById("answerInput").addEventListener(
  "keydown",
  event => {
    if (event.key === "Enter") {
      checkInput();
    }
  }
);

// ==============================
// 正誤表示
// ==============================

function showFeedback(id, correct, message) {
  const element = document.getElementById(id);

  element.className =
    "feedback " + (correct ? "correct" : "wrong");

  element.textContent = message;
}

function markAnswered() {
  answeredQuestions.add(currentIndex);
}

function updateScore() {
  document.getElementById("scoreDisplay").textContent =
    "正解数：" + correctCount;
}

// ==============================
// 前後移動
// ==============================

function nextQuestion() {
  if (filteredQuestions.length === 0) return;

  currentIndex++;

  if (currentIndex >= filteredQuestions.length) {
    currentIndex = 0;
  }

  updateDisplay();
}

function previousQuestion() {
  if (filteredQuestions.length === 0) return;

  currentIndex--;

  if (currentIndex < 0) {
    currentIndex = filteredQuestions.length - 1;
  }

  updateDisplay();
}

// ==============================
// 答え一覧
// ==============================

function createAnswerTable() {
  const tbody = document.getElementById("answerTable");

  tbody.innerHTML = "";

  filteredQuestions.forEach((q, index) => {
    const tr = document.createElement("tr");

    const number = document.createElement("td");
    const question = document.createElement("td");
    const answer = document.createElement("td");

    number.textContent = index + 1;
    question.textContent = q.question;
    answer.textContent = q.answer;

    tr.appendChild(number);
    tr.appendChild(question);
    tr.appendChild(answer);

    tbody.appendChild(tr);
  });

  if (filteredQuestions.length === 0) {
    tbody.innerHTML =
      '<tr><td colspan="3" class="empty">問題がありません。</td></tr>';
  }
}

// ==============================
// 地域調査まとめ
// ==============================

function createSummary() {
  const grid = document.getElementById("summaryGrid");

  grid.innerHTML = "";

  summaryData.forEach(item => {
    const card = document.createElement("div");

    card.className = "summary-card";

    const title = document.createElement("h3");
    const text = document.createElement("p");

    title.textContent = item.title;
    text.textContent = item.text;

    card.appendChild(title);
    card.appendChild(text);

    grid.appendChild(card);
  });
}

// ==============================
// リセット
// ==============================

function resetProgress() {
  if (!confirm("学習状況をリセットする？")) return;

  currentIndex = 0;
  correctCount = 0;

  answeredQuestions.clear();

  updateDisplay();
}

// ==============================
// 起動処理
// ==============================

updateUnitOptions();
prepareQuestions();

</script>
